<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mockup</title>
  <style>
    :root {
      --rail: 268px;
      --ink: #1a1b1f;
      --line: #e3e3e3;
      --mut: #8a8a8a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: #fff;
      overflow: hidden;
    }

    /* ---- controls ---- */
    .rail {
      width: var(--rail);
      flex: 0 0 var(--rail);
      height: 100%;
      overflow-y: auto;
      padding: 28px 24px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .rail h1 {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--mut);
      margin: 0;
      font-weight: 500;
    }
    .grp { display: flex; flex-direction: column; gap: 8px; }
    .grp > label {
      font-size: 11px;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--mut);
    }
    input[type="text"], select {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      color: inherit;
      background: #fff;
    }
    input[type="text"]:focus, select:focus { outline: none; border-color: var(--ink); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input[type="text"] { flex: 1; }
    .grp > label output { float: right; letter-spacing: 0; color: var(--ink); }
    input[type="range"] { width: 100%; height: 20px; margin: 0; accent-color: var(--ink); cursor: pointer; }
    input[type="color"] {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
    .seg { display: flex; gap: 6px; }
    .seg button {
      flex: 1;
      height: 32px;
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--mut);
      border-radius: 6px;
      cursor: pointer;
    }
    .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .acts { display: flex; flex-direction: column; gap: 8px; }
    .acts button {
      height: 40px;
      font: inherit;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }
    .acts button.ghost { background: #fff; color: var(--ink); border-color: var(--line); }
    .acts button.ghost.on { background: #fff; color: var(--ink); border-color: var(--ink); }
    #save.rec { background: #c0392b; border-color: #c0392b; }
    #save.busy { opacity: .6; }

    /* ---- stage ---- */
    /* nothing here may use transform: a CSS-transformed ancestor stops the
       browser from handing clicks to the site inside the iframe */
    .work {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      overflow: hidden;
    }
    #stage { position: relative; overflow: hidden; flex: none; }
    .frame { position: absolute; }
    .frame img.chrome { display: block; width: 100%; height: auto; pointer-events: none; }
    /* the phone is a frame with a see-through screen, so it sits over the site */
    .frame img.phone { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .frame img[hidden], .urlbox[hidden] { display: none; }        /* beats the rules above */
    .vp { position: absolute; left: 0; width: 100%; overflow: hidden; background: #fff; isolation: isolate; }
    .vp iframe { border: 0; display: block; }
    .vp img.shot { display: block; width: 100%; will-change: transform; }
    .urlbox {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35em;
      background: #f2f2f2;
      color: #4c4c4c;
      white-space: nowrap;
      overflow: hidden;
    }

    /* while grabbing, the window is blown up to the size of the work area
       so the capture has as many real pixels of the site as possible */
    body.cap #stage { background: transparent !important; }
    body.cap .frame { position: fixed; }
    .flag {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 9;
      background: rgba(26,27,31,.9);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      display: none;
    }
    body.cap .flag { display: block; }
    .work { position: relative; }
    .note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 9;
      background: rgba(26,27,31,.9);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .note[hidden] { display: none; }
    /* while a picture or a video is taken, no pointer over the work area (what gets filmed;
       the controls on the left keep theirs): Chrome draws
       the mouse into a tab capture even when asked not to */
    /* While a picture or a video is taken the real pointer never shows over the work
       area: Chrome draws it into a tab capture whatever it is asked. In its place you
       see a drawn pointer that follows the mouse. Only the site's own element is filmed
       (Element Capture), and the drawn pointer sits outside it, so it never reaches the
       video. The site stays clickable when it is opened through the dev server (then its
       own pointer can be hidden too); otherwise clicks are off while filming. */
    body.cap #work, body.cap #work * { cursor: none !important; }
    .fake-cursor { position: fixed; left: 0; top: 0; z-index: 2147483647; width: 18px; height: 26px;
      pointer-events: none; display: none; will-change: transform; }
    body.cap-draw .fake-cursor.on { display: block; }
  </style>
</head>
<body>
  <aside class="rail">
    <h1>Mockup</h1>

    <div class="seg">
      <button id="dDesk" type="button">Desktop</button>
      <button id="dMob" type="button">Mobile</button>
    </div>

    <div class="seg">
      <button id="vMock" type="button">Mockup</button>
      <button id="vScreen" type="button">Tela</button>
    </div>

    <div class="grp">
      <label for="url">Site</label>
      <input id="url" type="text" placeholder="https://www.embya.com.br/" spellcheck="false">
    </div>

    <div class="grp" id="shownGrp">
      <label for="shown">Endereço na barra</label>
      <input id="shown" type="text" placeholder="o mesmo do site" spellcheck="false">
    </div>

    <div class="grp" id="bgGrp">
      <label for="bgText">Fundo</label>
      <div class="row">
        <input id="bgText" type="text" spellcheck="false">
        <input id="bg" type="color">
      </div>
    </div>

    <div class="grp" id="outGrp">
      <label for="out">Tamanho</label>
      <select id="out">
        <option value="2000x1125">2000 × 1125</option>
        <option value="2400x1350">2400 × 1350</option>
        <option value="1600x900">1600 × 900</option>
        <option value="2000x1500">2000 × 1500</option>
      </select>
    </div>

    <div class="grp" id="sizeGrp">
      <label for="fw">Largura da janela <output id="fwOut"></output></label>
      <input id="fw" type="range" min="76" max="140" step="1">
    </div>

    <div class="grp">
      <label>Captura</label>
      <div class="seg">
        <button id="cPic" type="button">Print</button>
        <button id="cVid" type="button">Vídeo</button>
      </div>
    </div>

    <div class="grp" id="fmtGrp">
      <label for="fmt">Arquivo</label>
      <select id="fmt">
        <option value="jpg">JPG</option>
        <option value="png">PNG</option>
      </select>
    </div>

    <div class="acts">
      <button id="roll" class="ghost" type="button">Rolar</button>
      <button id="save" type="button">Baixar</button>
    </div>
  </aside>

  <main class="work" id="work">
    <div id="stage">
      <div class="frame" id="frame">
        <img class="chrome" id="chrome" src="images/safari-frame.svg" alt="">
        <div class="vp" id="vp"><iframe id="site"></iframe></div>
        <div class="urlbox" id="urlbox"></div>
        <img class="phone" id="phone" alt="" hidden>
      </div>
    </div>
    <div class="note" id="note" hidden></div>
  </main>
  <div class="flag" id="flag">Gravando — clique em "Parar e salvar"</div>

  <svg class="fake-cursor" id="fakeCursor" viewBox="0 0 18 26" aria-hidden="true"><path d="M1.5 1.5v19.2l4.6-4.4 3.1 7.4 3.3-1.4-3.1-7.2h6.4z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <script>
  (function () {
    "use strict";

    // geometry of images/safari-frame.svg, in its own coordinates
    var F = { w: 899.239, h: 550.784, chrome: 37.2344, r: 16.8607 };
    var PILL_CX = 268.367 + 362.987 / 2;          // centre of the address pill
    var TXT = { y: 12.9297, h: 11, size: 9.3 };   // the lock + domain sit in this band
    var CLEAR = { x: 300, w: 300 };               // repainted slice of the pill, clear of the icons
    var SITE_W = 1440;                            // width the site is drawn at
    var FRAME = 0.70;                             // window width, as a share of the picture

    // the slider: how much wider (or narrower) the window is than its usual shape.
    // Only the width changes; the height stays. The site gets the extra width too,
    // as a wider browser window would give it.
    function wide() {
      if (mobile() || screen()) return 1;
      var o = outSize(), base = o.w * FRAME;
      return Math.max(0.76, Math.min((S.wide || 100) / 100, o.w * 0.98 / base));
    }
    function siteWidth() { return mobile() ? MOB_W : Math.round(SITE_W * wide()); }
    // the stretched window bar: the Safari drawing in slices, the empty stretches of
    // the bar widened and the icons, the address pill and the corners left as drawn
    var chromeRaw = null, chromeFor = "";
    fetch("images/safari-frame.svg").then(function (r) { return r.text(); }).then(function (t) {
      chromeRaw = t.replace(/^[\s\S]*?<svg[^>]*>/, "").replace(/<\/svg>\s*$/, "");
      setChrome();
    });
    function setChrome() {
      if (!chromeRaw) return;
      var k = wide().toFixed(3);
      if (chromeFor === k) return;
      chromeFor = k;
      if (+k === 1) { chrome.src = "images/safari-frame.svg"; return; }
      var E = 900 * (k - 1), h = E / 2;
      function cut(from, to, x, w) {
        return '<svg x="' + x + '" y="0" width="' + w + '" height="551" viewBox="' + from + ' 0 ' + (to - from) + ' 551" preserveAspectRatio="none">' + chromeRaw + "</svg>";
      }
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + (900 + E) + '" height="551" viewBox="0 0 ' + (900 + E) + ' 551" fill="none">' +
        // the stretches first, a touch over their edges, then the fixed parts on top
        cut(137, 240, 134, 109 + h) + cut(642, 778, 639 + h, 142 + h) +
        cut(0, 135, 0, 135) + cut(242, 640, 242 + h, 398) + cut(780, 900, 780 + E, 120) + "</svg>";
      chrome.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    // the phone, drawn as vector so it stays sharp at any size. Proportions come
    // from the reference render: body 270 x 556, screen inset about 4.4%.
    var PH = {
      vx: -16, vw: 1032, vh: 2059,                // drawing box (room for the side buttons)
      w: 1000, bez: 44, r: 137, sr: 100,          // body width, bezel, corner radii
      isl: { w: 318, h: 92, top: 30, r: 46 }      // the island
    };
    var MOB_W = 390;                              // width the site is drawn at on the phone
    var MOB_FILL = 0.80;                          // phone height, as a share of the picture
    var MOB_STATUS = 59;                          // white band on top, so the site clears the island

    function rr(x, y, w, h, r) {
      return "M" + (x + r) + "," + y + "h" + (w - 2 * r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
        "v" + (h - 2 * r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r +
        "h" + (-(w - 2 * r)) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + (-r) +
        "v" + (-(h - 2 * r)) + "a" + r + "," + r + " 0 0 1 " + r + "," + (-r) + "z";
    }

    var phoneURL = null;
    function phoneSVG() {
      if (phoneURL) return phoneURL;
      var W = PH.w, H = PH.vh, b = PH.bez;
      var btn = function (x, y, h) {
        return '<rect x="' + x + '" y="' + y + '" width="16" height="' + h + '" rx="8" fill="#1c1c1c"/>';
      };
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + PH.vw + '" height="' + PH.vh +
        '" viewBox="' + PH.vx + ' 0 ' + PH.vw + ' ' + PH.vh + '">' +
        btn(-12, 430, 92) + btn(-12, 600, 170) + btn(-12, 800, 170) +   // action and volume
        btn(W - 4, 660, 240) +                                          // power
        '<path fill="#121212" fill-rule="evenodd" d="' + rr(0, 0, W, H, PH.r) + " " +
        rr(b, b, W - 2 * b, H - 2 * b, PH.sr) + '"/>' +
        '<rect x="' + ((W - PH.isl.w) / 2) + '" y="' + (b + PH.isl.top) + '" width="' + PH.isl.w +
        '" height="' + PH.isl.h + '" rx="' + PH.isl.r + '" fill="#000"/>' +
        '</svg>';
      phoneURL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      return phoneURL;
    }

    // where the screen sits inside the drawing box, as fractions of it
    var SCR = {
      x: (PH.bez - PH.vx) / PH.vw,
      y: PH.bez / PH.vh,
      w: (PH.w - 2 * PH.bez) / PH.vw,
      h: (PH.vh - 2 * PH.bez) / PH.vh,
      r: PH.sr / PH.vw
    };
    function mobile() { return S.device === "mobile"; }
    // "Tela": the site alone, edge to edge — no window, no phone, no margins
    function screen() { return S.view === "screen"; }
    // the screen's own shape (width / height): the picture's on a computer, the
    // phone's screen on a phone
    function screenRatio() {
      if (mobile()) return (SCR.w * PH.vw) / (SCR.h * PH.vh);
      var p = S.out.split("x"); return +p[0] / +p[1];
    }

    var $ = function (id) { return document.getElementById(id); };
    var stage = $("stage"), frame = $("frame"), vp = $("vp"), urlbox = $("urlbox"),
        chrome = $("chrome"), phone = $("phone"), site = $("site"), work = $("work"), saveBtn = $("save");

    // the address is used exactly as typed; the bar only hides the "www."
    var S = { url: "https://www.embya.com.br/", bg: "#F2F2F2", out: "2000x1125", fmt: "jpg", device: "desktop" };
    try { Object.assign(S, JSON.parse(localStorage.getItem("mockup2") || "{}")); } catch (e) {}
    function keep() { try { localStorage.setItem("mockup2", JSON.stringify(S)); } catch (e) {} }

    // A picture of the site, shown instead of the live frame: a print pasted in
    // ("paste"), or the server's photo of a site that refuses to be framed ("shot").
    // picY is how far it has rolled, in the picture's own pixels.
    var pic = null, picKind = null, picY = 0;
    var probeKey = null, probeTok = 0;
    // A site that refuses to be framed is fetched through the dev server instead
    // (/site), which hands it back without that refusal. It is then same-origin
    // with this page, so it can really be scrolled and its animations run.
    var proxied = false, frameCache = {};
    function frameSrc() {
      return proxied ? "/site?url=" + encodeURIComponent(full(S.url)) : full(S.url);
    }
    var rec = null;           // MediaRecorder, while a video is being taken
    var LOCAL_PROXY = false;  // the dev server answers: sites can be opened through it
    var rolling = false, at = 0, tall = 0, seen = 0, tick = null;   // the gentle scroll

    // width the browser gives a scrollbar, so the site's own bar can be clipped away
    var SB = null;
    function scrollbar() {
      if (SB !== null) return SB;
      var d = document.createElement("div");
      d.style.cssText = "position:absolute;visibility:hidden;width:100px;height:100px;overflow:scroll";
      document.body.appendChild(d);
      SB = (d.offsetWidth - d.clientWidth) || 15;   // overlay bars measure 0 but still paint
      d.remove();
      return SB;
    }

    function outSize() {
      // a phone's screen comes out at an iPhone's own resolution (3x)
      if (screen() && mobile()) return { w: MOB_W * 3, h: Math.round(MOB_W * 3 / screenRatio()) };
      var p = S.out.split("x"); return { w: +p[0], h: +p[1] };
    }
    // what the address bar says: the address typed for it, or else the site's own
    function barText() {
      var t = (S.shown || "").trim();
      if (!t) return host(S.url);
      return t.replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/$/, "");
    }
    function full(u) { return /^https?:/.test(u) ? u : "https://" + u; }
    function host(u) {
      try { return new URL(full(u)).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
    }

    // ---- drawing on screen ------------------------------------------------
    // sizes the frame (and the site inside it) for a given frame width
    function sizeFrame(fw) {
      var fh, top, siteW;
      if (screen()) {
        fh = fw / screenRatio();
        top = 0;
        siteW = mobile() ? MOB_W : SITE_W;
        frame.style.width = fw + "px";
        frame.style.height = fh + "px";
        phone.hidden = true;
        chrome.hidden = true;
        urlbox.hidden = true;
        vp.style.left = "0px";
        vp.style.width = "100%";
        vp.style.top = "0px";
        vp.style.height = fh + "px";
        vp.style.borderRadius = "0";
        vp.style.background = "#fff";
      } else if (mobile()) {
        fh = fw * PH.vh / PH.vw;
        top = fh * SCR.y;
        siteW = MOB_W;
        frame.style.width = fw + "px";
        frame.style.height = fh + "px";
        phone.hidden = false;
        // set it once: assigning src again, even unchanged, reloads the image, and its
        // load event lays the page out afresh (it undid the capture settings mid-recording)
        if (phone.getAttribute("src") !== phoneSVG()) phone.src = phoneSVG();
        chrome.hidden = true;
        urlbox.hidden = true;
        vp.style.left = (fw * SCR.x) + "px";
        vp.style.width = (fw * SCR.w) + "px";
        vp.style.top = top + "px";
        vp.style.height = (fh * SCR.h) + "px";
        var pr = fw * SCR.r;
        vp.style.borderRadius = pr + "px";
        vp.style.background = "#fff";              // the band the site starts below
      } else {
        fh = fw * F.h / (F.w * wide());
        top = fh * (F.chrome / F.h);
        siteW = siteWidth();
        setChrome();
        frame.style.width = fw + "px";
        frame.style.height = fh + "px";
        phone.hidden = true;
        chrome.hidden = false;
        vp.style.left = "0px";
        vp.style.width = "100%";
        vp.style.top = top + "px";
        vp.style.height = (fh - top) + "px";
        var r = fh * (F.r / F.h);
        vp.style.borderRadius = "0 0 " + r + "px " + r + "px";
        vp.style.background = "#fff";
      }

      if (pic) {
        site.style.display = "none";
        placePic();
      } else {
        site.style.display = "block";
        // zoom, not transform: the site stays clickable and still lays out at its
        // own width. The frame is widened by the scrollbar so that bar is clipped
        // out of sight, leaving exactly the width the saved picture uses.
        var inPhone = mobile() && !screen();
        var k = (inPhone ? fw * SCR.w : fw) / siteW;
        site.style.width = (siteW + scrollbar()) + "px";
        site.style.zoom = k;
        site.style.marginTop = inPhone ? MOB_STATUS + "px" : "0";
        seen = (inPhone ? fh * SCR.h : fh - top) / k;   // visible height, in site pixels
        if (inPhone) seen -= MOB_STATUS;
        if (rolling && !proxied) {
          // while rolling, the frame holds the whole page and glides upwards
          tall = Math.max(seen * 6, 4000);
          site.style.height = tall + "px";
          site.style.transform = "translateY(" + (-at) + "px)";
        } else {
          site.style.height = seen + "px";
          site.style.transform = "";
        }
      }
      drawUrl(fw);
      return fh;
    }

    // the frame ships with "figma.com" drawn as vectors, so we repaint that slice
    function drawUrl(fw) {
      if (screen()) { urlbox.hidden = true; return; }
      var d = barText();
      if (!d) { urlbox.hidden = true; return; }
      urlbox.hidden = false;
      var sx = fw / (F.w * wide()), shift = F.w * (wide() - 1) / 2;
      urlbox.style.left = ((CLEAR.x + shift) * sx) + "px";
      urlbox.style.width = (CLEAR.w * sx) + "px";
      urlbox.style.top = (TXT.y * sx) + "px";
      urlbox.style.height = (TXT.h * sx) + "px";
      urlbox.style.fontSize = (TXT.size * sx) + "px";
      var l = TXT.size * sx * 0.95;
      urlbox.innerHTML =
        '<svg width="' + l + '" height="' + l + '" viewBox="0 0 12 12" fill="none">' +
        '<path d="M3.6 5.1V3.9a2.4 2.4 0 0 1 4.8 0v1.2" stroke="#9E9E9E" stroke-width="1"/>' +
        '<rect x="2.7" y="5" width="6.6" height="5.2" rx="1.3" fill="#9E9E9E"/></svg><span></span>';
      urlbox.lastChild.textContent = d;
    }

    // how big the frame is on the picture: the window by width, the phone by height
    function frameBox(o) {
      if (screen()) return { w: o.w, h: o.h };
      if (mobile()) {
        var h = o.h * MOB_FILL;
        return { w: h * PH.vw / PH.vh, h: h };
      }
      // the slider's share of the picture, never taller than the picture allows
      var h = Math.min(o.w * FRAME * F.h / F.w, o.h * 0.96);
      return { w: h * F.w / F.h * wide(), h: h };
    }

    function layout(noProbe) {
      var o = outSize();
      stage.style.width = o.w + "px";
      stage.style.height = o.h + "px";
      stage.style.background = S.bg;
      var box = frameBox(o);
      frame.style.left = ((o.w - box.w) / 2) + "px";
      frame.style.top = ((o.h - box.h) / 2) + "px";
      sizeFrame(box.w);
      if (!pic) {
        var want = frameSrc();
        if (site.dataset.src !== want) { site.dataset.src = want; site.src = want; }
      }
      fit();
      if (!noProbe) probe();
    }

    // ---- the picture in place of the site ----------------------------------
    // the window's screen, in stage pixels, and the white band under the island
    function vpBox() {
      var fw = parseFloat(frame.style.width) || 0;
      if (screen()) return { w: fw, h: fw / screenRatio(), band: 0 };
      if (mobile()) {
        var w = fw * SCR.w;
        return { w: w, h: fw * PH.vh / PH.vw * SCR.h, band: w * (MOB_STATUS / MOB_W) };
      }
      var fh = fw * F.h / (F.w * wide());
      return { w: fw, h: fh - fh * (F.chrome / F.h), band: 0 };
    }
    function placePic() {
      if (!pic) return;
      var b = vpBox(), k = b.w / pic.naturalWidth;
      pic.style.marginTop = b.band + "px";
      pic.style.transform = "translateY(" + (-picY * k) + "px)";
    }
    // how much of the picture fits in the window, in the picture's own pixels
    function picSeen() {
      var b = vpBox();
      return (b.h - b.band) * pic.naturalWidth / b.w;
    }
    function setPic(im, kind) {
      unroll();
      if (pic && pic !== im) pic.remove();
      pic = im; picKind = kind; picY = 0;
      im.className = "shot";
      vp.appendChild(im);
      layout(true);
    }
    function clearPic() {
      unroll();
      if (pic) pic.remove();
      pic = null; picKind = null; picY = 0;
    }

    var noteEl = $("note");
    function note(t) { noteEl.textContent = t || ""; noteEl.hidden = !t; }

    // A site that refuses to be framed stays blank in the window. It is opened
    // through the dev server instead; if even that comes back empty, the server's
    // photo of the whole page is shown.
    function probe() {
      if (picKind === "paste") return;
      var url = full(S.url), key = url + "|" + S.device;
      if (key === probeKey) return;
      probeKey = key;
      var tok = ++probeTok;
      if (picKind === "shot") clearPic();        // a photo of another address or width
      note("");
      var known = frameCache[url];
      var ask = known !== undefined ? Promise.resolve({ frameable: known }) :
        fetch("/frameable?url=" + encodeURIComponent(url))
          .then(function (r) { if (r.ok) LOCAL_PROXY = true; return r.ok ? r.json() : { frameable: true }; })
          .catch(function () { return { frameable: true }; });
      ask.then(function (d) {
        frameCache[url] = d.frameable;
        if (tok !== probeTok) return;
        // through the dev server whenever it is there: the page is then ours to reach
        // (its own pointer can be hidden while filming, and it scrolls for real)
        proxied = !d.frameable || LOCAL_PROXY;
        layout(true);
        if (proxied) {
          if (!d.frameable) note("Este site bloqueia moldura — abrindo pelo servidor local…");
          whenFramed(tok);
        }
      });
    }

    // once the site has come through the dev server, check it really drew something
    function whenFramed(tok) {
      // the page may have come in already, when the last site was proxied too
      var d = null;
      try { d = site.contentDocument; } catch (e) {}
      if (d && d.readyState === "complete" && d.location.href !== "about:blank" && site.src.indexOf("/site?") >= 0) {
        return checkFramed(tok);
      }
      site.addEventListener("load", function onLoad() {
        if (site.src.indexOf("/site?") < 0) return;   // the blank page between sites
        site.removeEventListener("load", onLoad);
        checkFramed(tok);
      });
    }
    function checkFramed(tok) {
      setTimeout(function () {
        if (tok !== probeTok) return;
        var ok = false;
        try {
          var b = site.contentDocument && site.contentDocument.body;
          var text = b ? b.innerText.trim() : "";
          // an app that crashed away from its real address shows its error page
          var crashed = text.length < 400 &&
            /couldn.t load|application error|client-side exception|something went wrong|page not found|404/i.test(text);
          ok = !!b && b.children.length > 0 && text.length > 0 && !crashed;
        } catch (e) {}
        if (ok) note("");
        else if (frameCache[full(S.url)]) { proxied = false; layout(true); }   // the site frames fine as it is
        else takeShot(tok);
      }, 2500);
    }

    function takeShot(tok) {
      note("Não abriu pelo servidor local — capturando a página…");
      serverShot(true).then(function (im) {
        if (tok !== probeTok) return;
        note("");
        setPic(im, "shot");
      }, function () {
        if (tok === probeTok) note("Este site bloqueia a moldura e não deu para capturá-lo");
      });
    }

    function fit() {
      var o = outSize();
      var k = Math.min((work.clientWidth - 48) / o.w, (work.clientHeight - 48) / o.h);
      stage.style.zoom = k;          // zoom keeps the site inside clickable
    }

    // ---- the picture ------------------------------------------------------
    function roundRect(c, x, y, w, h, r) {
      if (c.roundRect) { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // draws background + window + whatever is showing the site, at export size.
    // `trim` drops a few pixels from each side of the source: a screen capture
    // carries a black hairline on its edge, and it would land on the window's rim.
    // `offY` is how far down the source to start, in source pixels (a rolled picture).
    function compose(c, o, src, srcW, srcH, trim, offY) {
      trim = trim || 0;
      offY = offY || 0;
      var box = frameBox(o);
      var fw = box.w, fh = box.h;
      var fx = (o.w - fw) / 2, fy = (o.h - fh) / 2, sx = fh / F.h, shift = F.w * (wide() - 1) / 2;

      if (screen()) {
        // the site alone, filling the picture's width from the top
        c.fillStyle = "#fff";
        c.fillRect(0, 0, o.w, o.h);
        if (src && srcW && srcH) {
          var qw = srcW - trim * 2, qh = srcH - trim;
          c.drawImage(src, trim, 0, qw, qh, 0, -offY * (o.w / qw), o.w, Math.max(o.w * qh / qw, o.h));
        }
        return;
      }

      c.fillStyle = S.bg;
      c.fillRect(0, 0, o.w, o.h);

      if (mobile()) {
        // the site first, then the phone frame over it: its screen is see-through
        if (src && srcW && srcH) {
          var px = fx + fw * SCR.x, py = fy + fh * SCR.y;
          var pw = fw * SCR.w, ph = fh * SCR.h;
          var band = pw * (MOB_STATUS / MOB_W);     // white strip under the island
          c.save();
          roundRect(c, px, py, pw, ph, fw * SCR.r);
          c.clip();
          c.fillStyle = "#fff";
          c.fillRect(px, py, pw, ph);
          var msw = srcW - trim * 2, msh = srcH - trim;
          var mih = pw * msh / msw;
          c.drawImage(src, trim, 0, msw, msh, px, py + band - offY * (pw / msw), pw, Math.max(mih, ph - band));
          c.restore();
        }
        c.drawImage(phone, fx, fy, fw, fh);
        return;
      }

      c.drawImage(chrome, fx, fy, fw, fh);

      if (src && srcW && srcH) {
        var top = fy + fh * (F.chrome / F.h), ch = fh - fh * (F.chrome / F.h);
        c.save();
        roundRect(c, fx, fy, fw, fh, F.r * sx);
        c.clip();
        c.beginPath();
        c.rect(fx, top, fw, ch);
        c.clip();
        var sw = srcW - trim * 2, sh = srcH - trim;
        var ih = fw * sh / sw;                     // fill the width, align to the top
        c.drawImage(src, trim, 0, sw, sh, fx, top - offY * (fw / sw), fw, Math.max(ih, ch));
        c.restore();
      }

      var d = barText();
      if (d) {
        c.fillStyle = "#f2f2f2";
        c.fillRect(fx + (CLEAR.x + shift) * sx, fy + TXT.y * sx, CLEAR.w * sx, TXT.h * sx);
        var fs = TXT.size * sx, u = fs * 0.95 / 12;
        c.font = fs + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
        c.textBaseline = "middle";
        var tw = c.measureText(d).width, lock = fs * 0.95, gap = fs * 0.35;
        var x0 = fx + (PILL_CX + shift) * sx - (tw + lock + gap) / 2;
        var cy = fy + (TXT.y + TXT.h / 2) * sx;
        c.fillStyle = "#9E9E9E";
        c.fillRect(x0 + 2.7 * u, cy - lock / 2 + 5 * u, 6.6 * u, 5.2 * u);
        c.beginPath();
        c.lineWidth = u;
        c.strokeStyle = "#9E9E9E";
        c.arc(x0 + 6 * u, cy - lock / 2 + 3.9 * u, 2.4 * u, Math.PI, 0);
        c.stroke();
        c.fillStyle = "#4C4C4C";
        c.fillText(d, x0 + lock + gap, cy + fs * 0.04);
      }
    }

    function send(blob, ext) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (host(S.url) || "mockup").replace(/[^a-z0-9.-]/gi, "-") + "-mockup." + ext;
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    }

    function idle() { return S.fmt === "vid" ? "Gravar" : "Baixar"; }
    function busy(on, label) {
      saveBtn.classList.toggle("busy", !!on);
      saveBtn.disabled = !!on;
      saveBtn.textContent = label || idle();
    }
    function flash(label) {
      saveBtn.textContent = label;
      setTimeout(function () { if (!rec) saveBtn.textContent = idle(); }, 2600);
    }

    // The dev server can photograph the site with the browser installed on this
    // machine. It needs no permission and works even where screen capture is off.
    // `whole` asks for the full length of the page, not just the first screen
    async function serverShot(whole) {
      var o = outSize(), box = frameBox(o), w, h;
      if (screen()) {
        w = mobile() ? MOB_W : SITE_W;
        h = Math.round(w * o.h / o.w);
      } else if (mobile()) {
        w = MOB_W;
        h = Math.round(MOB_W * (box.h * SCR.h) / (box.w * SCR.w));
      } else {
        w = siteWidth();
        h = Math.round(w * (box.h * (F.h - F.chrome) / F.h) / box.w);
      }
      var r = await fetch("/shot?url=" + encodeURIComponent(full(S.url)) + "&w=" + w + "&h=" + h + (whole ? "&full=1" : ""));
      if (!r.ok) throw new Error(await r.text());
      var im = new Image();
      im.src = URL.createObjectURL(await r.blob());
      await im.decode();
      return im;
    }

    // A page can't read the pixels of another site loaded inside it, so for a live
    // site we ask the browser for this tab's own picture and crop it to the window.
    function grabStream() {
      return navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 30, cursor: "never" },      // keep the pointer out of the picture
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: "include"
      });
    }

    // only the site's element is filmed. Element Capture (restrictTo) leaves out
    // whatever is drawn over it, so the pointer you see while recording stays out of the
    // video; where it is missing, the older crop is used and the pointer is hidden
    function siteDoc() { try { return site.contentDocument || null; } catch (e) { return null; } }
    var fake = null;
    function pointAt(x, y) {
      if (!fake) fake = $("fakeCursor");
      var r = work.getBoundingClientRect();
      fake.classList.toggle("on", x >= r.left && x <= r.right && y >= r.top && y <= r.bottom);
      fake.style.transform = "translate(" + (x - 1.5) + "px," + (y - 1.5) + "px)";
    }
    // a move inside the site, in the site's own pixels: back to the page's
    function inSite(e) {
      var r = site.getBoundingClientRect(), k = r.width / (site.clientWidth || r.width);
      pointAt(r.left + e.clientX * k, r.top + e.clientY * k);
    }
    document.addEventListener("pointermove", function (e) { pointAt(e.clientX, e.clientY); }, { passive: true });
    // a click inside the site that opens another of its pages: the new page hides its
    // pointer too (one that left the dev server can't be reached: clicks stop instead)
    site.addEventListener("load", function () {
      if (!document.body.classList.contains("cap-live")) return;
      var doc = siteDoc();
      if (!doc) { site.style.pointerEvents = "none"; return; }
      var st = doc.createElement("style"); st.id = "__nocursor";
      st.textContent = "html, html * { cursor: none !important; }";
      (doc.head || doc.documentElement).appendChild(st);
      doc.addEventListener("pointermove", inSite, true);
    });

    // The site's own page, when it came through the dev server: its pointer is hidden
    // and it stays clickable while it is filmed. Returns whether that worked.
    function liveSite() {
      var doc = siteDoc();
      if (!doc || !doc.documentElement) return false;
      var st = doc.getElementById("__nocursor");
      if (!st) { st = doc.createElement("style"); st.id = "__nocursor"; (doc.head || doc.documentElement).appendChild(st); }
      st.textContent = "html, html * { cursor: none !important; }";
      doc.removeEventListener("pointermove", inSite, true);
      doc.addEventListener("pointermove", inSite, true);
      document.body.classList.add("cap-live");
      site.style.pointerEvents = "";
      return true;
    }
    async function cropToSite(track) {
      try { await track.applyConstraints({ cursor: "never" }); } catch (e) {}
      var done = false, restricted = false;
      if (window.RestrictionTarget && track.restrictTo) {
        try { await track.restrictTo(await RestrictionTarget.fromElement(vp)); done = restricted = true; } catch (e) {}
      }
      if (!done && window.CropTarget && track.cropTo) {
        try { await track.cropTo(await CropTarget.fromElement(vp)); done = true; } catch (e) {}
      }
      // the drawn pointer only where it is left out of the picture
      document.body.classList.toggle("cap-draw", restricted);
      // clicks work whenever the site's own page can be reached, restricted or not
      var live = !pic && liveSite();
      $("flag").textContent = live ? 'Gravando — clique em "Parar e salvar"'
        : 'Gravando — este site não abriu pelo servidor local, então os cliques ficam desligados';
      return done;
    }

    // a few source pixels to drop on each side (the capture's own black rim)
    function edgeTrim(w) { return Math.max(2, Math.round(w * 0.004)); }

    // blow the window up to the size of the work area while we capture
    function bigFrame() {
      document.body.classList.add("cap");
      stage.style.zoom = 1;
      site.style.pointerEvents = "none";   // no hover states while the camera is on
      var w = work.clientWidth, h = work.clientHeight;
      // as big as fits: the window by its own shape, the phone by the phone's
      var fw = screen() ? Math.min(w, h * screenRatio())
        : mobile() ? Math.min(w, h * PH.vw / PH.vh) : Math.min(w, h * F.w * wide() / F.h);
      var fh = sizeFrame(fw);
      // square corners: the window and the phone round the picture themselves when
      // it is composed, and rounded corners caught here would show inside the screen
      vp.style.borderRadius = "0";
      if (mobile() && !screen()) {
        // the capture must hold the site alone. The phone is drawn over the screen
        // (it would come out twice, island and all) and the white band under the
        // island is added again when the picture is composed, so drop both here.
        phone.style.visibility = "hidden";
        site.style.marginTop = "0";
        if (!rolling || proxied) site.style.height = (parseFloat(site.style.height) + MOB_STATUS) + "px";
      }
      var r = work.getBoundingClientRect();
      frame.style.left = (r.left + (w - fw) / 2) + "px";
      frame.style.top = (r.top + (h - fh) / 2) + "px";
      return fw;
    }
    function smallFrame() {
      document.body.classList.remove("cap-live", "cap-draw");
      var doc = siteDoc();
      if (doc) {
        var st = doc.getElementById("__nocursor"); if (st) st.remove();
        doc.removeEventListener("pointermove", inSite, true);
      }
      document.body.classList.remove("cap");
      site.style.pointerEvents = "";
      phone.style.visibility = "";
      layout();                            // puts the frame back where it belongs
    }

    // The capture starts on the whole tab and only narrows to the site once the crop
    // takes hold, a few frames later. Wait until its frames have the site's shape,
    // or those first frames flash the wrong picture at the start of a recording.
    function cropSettled(v) {
      var want = vp.getBoundingClientRect(), ratio = want.width / want.height;
      var t0 = performance.now();
      return new Promise(function (done) {
        (function check() {
          var ok = v.videoWidth && Math.abs(v.videoWidth / v.videoHeight - ratio) < 0.03;
          if (ok || performance.now() - t0 > 1500) setTimeout(done, 250);   // and a beat to be sure
          else requestAnimationFrame(check);
        })();
      });
    }

    async function videoOf(stream) {
      var v = document.createElement("video");
      v.srcObject = stream;
      v.muted = true;
      v.playsInline = true;
      await v.play();
      await new Promise(function (r) { requestAnimationFrame(function () { requestAnimationFrame(r); }); });
      return v;
    }

    // ---- still ------------------------------------------------------------
    async function still() {
      var o = outSize();
      var cv = document.createElement("canvas");
      cv.width = o.w; cv.height = o.h;
      var c = cv.getContext("2d");

      if (pic) {
        compose(c, o, pic, pic.naturalWidth, pic.naturalHeight, 0, picY);
      } else {
        // the site exactly as it is on screen (the slide showing, how far it has
        // scrolled): this tab's own picture. The dev server's fresh photo of the
        // site is only the fallback when the screen can't be taken
        var stream = null;
        try { stream = await grabStream(); } catch (e) { stream = null; }
        if (!stream) {
          var im = await serverShot();
          compose(c, o, im, im.naturalWidth, im.naturalHeight);
        } else {
          var track = stream.getVideoTracks()[0];
          try {
            bigFrame();
            await cropToSite(track);
            var v = await videoOf(stream);
            await cropSettled(v);
            compose(c, o, v, v.videoWidth, v.videoHeight, edgeTrim(v.videoWidth));
          } finally {
            track.stop();
            smallFrame();
          }
        }
      }
      var png = S.fmt === "png";
      await new Promise(function (r) {
        cv.toBlob(function (b) { send(b, png ? "png" : "jpg"); r(); }, png ? "image/png" : "image/jpeg", 0.92);
      });
    }

    // ---- video ------------------------------------------------------------
    var mime = MediaRecorder.isTypeSupported("video/mp4;codecs=avc1.42E01E")
      ? { type: "video/mp4;codecs=avc1.42E01E", ext: "mp4" }
      : { type: "video/webm;codecs=vp9", ext: "webm" };

    async function startVideo() {
      var o = outSize();
      var cv = document.createElement("canvas");
      cv.width = o.w; cv.height = o.h;
      var c = cv.getContext("2d");

      // a picture is painted straight from memory: no screen capture, no permission
      var track = null, v = null;
      if (!pic) {
        var stream = await grabStream();
        track = stream.getVideoTracks()[0];
        bigFrame();
        await cropToSite(track);
        v = await videoOf(stream);
        await cropSettled(v);                // nothing is recorded before the crop holds
      } else if (!rolling) {
        roll();                              // a still picture only makes a video by rolling
      }

      var live = true;
      (function paint() {
        if (!live) return;
        if (pic) compose(c, o, pic, pic.naturalWidth, pic.naturalHeight, 0, picY);
        else compose(c, o, v, v.videoWidth, v.videoHeight, edgeTrim(v.videoWidth));
        requestAnimationFrame(paint);
      })();

      var chunks = [];
      rec = new MediaRecorder(cv.captureStream(30), { mimeType: mime.type, videoBitsPerSecond: 12e6 });
      rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function () {
        live = false;
        if (track) track.stop();
        rec = null;
        if (track) smallFrame();
        saveBtn.textContent = idle();
        saveBtn.classList.remove("rec");
        send(new Blob(chunks, { type: mime.type }), mime.ext);
      };
      if (track) track.addEventListener("ended", function () { if (rec) rec.stop(); });
      rec.start();
      saveBtn.textContent = "Parar e salvar";
      saveBtn.classList.add("rec");
    }

    // ---- the gentle scroll -------------------------------------------------
    // A page can't scroll a site from another domain, so instead the frame is made
    // tall enough to hold the whole page and slid upwards behind the window.
    function roll() {
      if (rolling) return;
      rolling = true;
      at = 0;
      $("roll").textContent = "Parar";
      $("roll").classList.add("on");
      if (pic) { rollPic(); return; }
      if (proxied) { rollFrame(); return; }
      relayout();
      var last = performance.now();
      (function step(now) {
        if (!rolling) return;
        at += (now - last) * 0.16;             // ~160 px a second, in the site's pixels
        last = now;
        if (at > tall - seen) at = 0;          // back to the top and round again
        site.style.transform = "translateY(" + (-at) + "px)";
        tick = requestAnimationFrame(step);
      })(last);
    }
    // a picture rolls the same way, at the same pace, by sliding it up the window
    function rollPic() {
      picY = 0;
      var HOLD = 1200;                           // ms to rest at the top and at the end
      var last = performance.now(), restUntil = last + HOLD;
      (function step(now) {
        if (!rolling || !pic) return;
        var max = Math.max(0, pic.naturalHeight - picSeen());
        if (now >= restUntil) {
          if (picY >= max) {
            picY = 0;                            // back to the top and round again
            restUntil = now + HOLD;
          } else {
            var siteW = siteWidth();
            picY = Math.min(max, picY + (now - last) * 0.16 * (pic.naturalWidth / siteW));
            if (picY >= max) restUntil = now + HOLD;
          }
          placePic();
        }
        last = now;
        tick = requestAnimationFrame(step);
      })(last);
    }
    // a site opened through the dev server is scrolled for real, so whatever it
    // animates on scroll plays as it goes
    function frameWin() {
      try { var w = site.contentWindow; return w && w.document ? w : null; } catch (e) { return null; }
    }
    function rollFrame() {
      var w = frameWin();
      if (!w) return;
      var y = 0, HOLD = 1200;
      var last = performance.now(), restUntil = last + HOLD;
      w.scrollTo({ top: 0, behavior: "instant" });
      (function step(now) {
        if (!rolling || !proxied || pic) return;
        var el = w.document.scrollingElement || w.document.documentElement;
        var max = Math.max(0, el.scrollHeight - w.innerHeight);
        if (now >= restUntil) {
          if (y >= max) {
            y = 0;                               // back to the top and round again
            restUntil = now + HOLD;
          } else {
            y = Math.min(max, y + (now - last) * 0.16);
            if (y >= max) restUntil = now + HOLD;
          }
          w.scrollTo({ top: y, behavior: "instant" });
        }
        last = now;
        tick = requestAnimationFrame(step);
      })(last);
    }
    function unroll() {
      if (!rolling) return;
      rolling = false;
      cancelAnimationFrame(tick);
      at = 0;
      picY = 0;
      if (proxied && frameWin()) frameWin().scrollTo({ top: 0, behavior: "instant" });
      $("roll").textContent = "Rolar";
      $("roll").classList.remove("on");
      relayout();
    }
    // mid-recording the frame is blown up for the capture: re-fit it the same way,
    // or layout() would put it back small and undo the capture's own settings
    function relayout() {
      if (document.body.classList.contains("cap")) bigFrame();
      else layout();
    }
    $("roll").onclick = function () { rolling ? unroll() : roll(); };

    // ---- wiring -----------------------------------------------------------
    saveBtn.onclick = async function () {
      if (rec) { rec.stop(); return; }
      try {
        if (S.fmt === "vid") { await startVideo(); return; }
        busy(true, "Gerando…");
        await still();
        busy(false);
      } catch (e) {
        smallFrame();
        busy(false);
        flash("Não deu — tente de novo");
      }
    };

    function setDevice(d) {
      S.device = d;
      $("dDesk").classList.toggle("on", d === "desktop");
      $("dMob").classList.toggle("on", d === "mobile");
      controls();
      unroll();
      keep();
      site.removeAttribute("data-src");    // the site must lay out again at the new width
      site.src = "about:blank";
      layout();
    }
    // which controls make sense: no window or background on a bare screen, and a
    // phone's screen has its own size
    function controls() {
      var sc = screen();
      $("vMock").classList.toggle("on", !sc);
      $("vScreen").classList.toggle("on", sc);
      $("shownGrp").style.display = sc ? "none" : "";
      $("bgGrp").style.display = sc ? "none" : "";
      $("outGrp").style.display = sc && mobile() ? "none" : "";
      $("sizeGrp").style.display = sc || mobile() ? "none" : "";
    }
    function setView(v) {
      S.view = v;
      controls();
      unroll();
      keep();
      layout();
    }
    $("vMock").onclick = function () { setView("mock"); };
    $("vScreen").onclick = function () { setView("screen"); };
    $("dDesk").onclick = function () { setDevice("desktop"); };
    $("dMob").onclick = function () { setDevice("mobile"); };

    $("url").value = S.url;
    function loadUrl() {
      var v = $("url").value.trim();
      if (!v || v === S.url) { drawUrl(parseFloat(frame.style.width)); return; }
      S.url = v;
      clearPic();
      keep(); layout();
    }
    $("url").addEventListener("change", loadUrl);
    $("shown").value = S.shown || "";
    $("shown").addEventListener("input", function () {
      S.shown = this.value;
      keep();
      drawUrl(parseFloat(frame.style.width));
    });
    $("url").addEventListener("keydown", function (e) { if (e.key === "Enter") this.blur(); });

    function setBg(v) {
      if (!/^#[0-9a-f]{6}$/i.test(v)) return;
      S.bg = v.toUpperCase();
      $("bg").value = v.toLowerCase();
      if ($("bgText").value.toUpperCase() !== S.bg) $("bgText").value = S.bg;
      keep(); layout();
    }
    $("bg").oninput = function () { setBg(this.value); };
    $("bgText").oninput = function () { setBg(this.value.trim()); };
    $("bgText").value = S.bg;
    setBg(S.bg);

    // the Safari window's width, as a share of the picture; it stays centred
    delete S.frame;                         // the earlier slider, which sized the whole window
    $("fw").value = S.wide || 100;
    $("fwOut").textContent = $("fw").value + "%";
    controls();
    $("fw").oninput = function () {
      S.wide = +this.value;
      $("fwOut").textContent = this.value + "%";
      if (!rec && !document.body.classList.contains("cap")) layout(true);
    };
    $("fw").onchange = function () { keep(); layout(); };
    $("out").value = S.out;
    $("out").onchange = function () { S.out = this.value; keep(); layout(); };
    // print or video; a print remembers its own file type
    if (S.fmt !== "vid") S.pic = S.fmt;
    function setKind(k) {
      S.fmt = k === "vid" ? "vid" : (S.pic || "jpg");
      $("cPic").classList.toggle("on", S.fmt !== "vid");
      $("cVid").classList.toggle("on", S.fmt === "vid");
      $("fmtGrp").style.display = S.fmt === "vid" ? "none" : "";
      if (!rec) saveBtn.textContent = S.fmt === "vid" ? "Gravar" : "Baixar";
      keep();
    }
    $("cPic").onclick = function () { setKind("pic"); };
    $("cVid").onclick = function () { setKind("vid"); };
    $("fmt").value = S.pic || "jpg";
    $("fmt").onchange = function () { S.pic = S.fmt = this.value; keep(); };
    setKind(S.fmt === "vid" ? "vid" : "pic");

    // a print can also be pasted or dropped in, and then it is used instead of the site
    function usePrint(file) {
      if (!file || !/^image\//.test(file.type)) return;
      var im = new Image();
      im.onload = function () {
        probeTok++;                          // a photo still on its way must not replace this
        note("");
        setPic(im, "paste");
      };
      im.src = URL.createObjectURL(file);
    }
    document.addEventListener("paste", function (e) {
      var it = e.clipboardData && e.clipboardData.items;
      for (var i = 0; it && i < it.length; i++) {
        if (/^image\//.test(it[i].type)) { usePrint(it[i].getAsFile()); break; }
      }
    });
    ["dragover", "drop"].forEach(function (ev) {
      work.addEventListener(ev, function (e) { e.preventDefault(); });
    });
    work.addEventListener("drop", function (e) { usePrint(e.dataTransfer.files[0]); });

    window.addEventListener("resize", function () { if (!rec) fit(); });
    // a frame image landing while recording must keep the capture layout
    chrome.addEventListener("load", function () { relayout(); });
    phone.addEventListener("load", function () { relayout(); });
    setDevice(S.device);
  })();
  </script>
</body>
</html>
